name: Build Blog

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'scripts/build_blog.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate blog HTML
        run: python3 scripts/build_blog.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ blog-en.html blog-de.html sitemap.xml feed-en.xml feed-de.xml
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build blog from markdown"
            git push
          fi
